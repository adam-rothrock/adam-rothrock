      - customers in deployment
      - not yet consuming
      - deployment whitespace
      - onboarding pipeline
    sql: |
      SELECT
           metronome_customer_name
          ,finance_segment
          ,flag                                     AS deployment_status
          ,opportunity_close_date
          ,DATEDIFF('day', opportunity_close_date, CURRENT_DATE) AS days_since_close
