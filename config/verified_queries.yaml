  # ── MONTH-OVER-MONTH REVENUE ────────────────────────────────────────────────

  - name: mom_revenue_changes
    question: "Which customers had the biggest MoM revenue change this month vs last month?"
    aliases:
      - biggest month over month revenue changes
      - biggest mom revenue change
      - mom revenue change by customer
      - month over month revenue changes
      - revenue change this month vs last month
      - which customers grew or declined most this month
    sql: |
      SELECT
           metronome_customer_name
          ,finance_segment
          ,SUM(CASE WHEN as_of_date >= DATE_TRUNC('month', CURRENT_DATE)
                         AND as_of_date <= CURRENT_DATE
                    THEN snapshot_date_customer_revenue_final ELSE 0 END)  AS current_period_revenue
          ,SUM(CASE WHEN as_of_date >= DATE_TRUNC('month', DATEADD('month', -1, CURRENT_DATE))
                         AND as_of_date <= DATEADD('month', -1, CURRENT_DATE)
                    THEN snapshot_date_customer_revenue_final ELSE 0 END)  AS prior_period_revenue
          ,SUM(CASE WHEN as_of_date >= DATE_TRUNC('month', CURRENT_DATE)
                         AND as_of_date <= CURRENT_DATE
                    THEN snapshot_date_customer_revenue_final ELSE 0 END)
           - SUM(CASE WHEN as_of_date >= DATE_TRUNC('month', DATEADD('month', -1, CURRENT_DATE))
                           AND as_of_date <= DATEADD('month', -1, CURRENT_DATE)
                      THEN snapshot_date_customer_revenue_final ELSE 0 END) AS revenue_change
          ,ROUND(
               (SUM(CASE WHEN as_of_date >= DATE_TRUNC('month', CURRENT_DATE)
                              AND as_of_date <= CURRENT_DATE
                         THEN snapshot_date_customer_revenue_final ELSE 0 END)
               - SUM(CASE WHEN as_of_date >= DATE_TRUNC('month', DATEADD('month', -1, CURRENT_DATE))
                               AND as_of_date <= DATEADD('month', -1, CURRENT_DATE)
                          THEN snapshot_date_customer_revenue_final ELSE 0 END))
               / NULLIF(SUM(CASE WHEN as_of_date >= DATE_TRUNC('month', DATEADD('month', -1, CURRENT_DATE))
                                      AND as_of_date <= DATEADD('month', -1, CURRENT_DATE)
                                 THEN snapshot_date_customer_revenue_final ELSE 0 END), 0)
               * 100
           , 1) AS pct_change
      FROM analytics.prod_internal_bi.finance_consumption_revenue_explorer
      WHERE (as_of_date >= DATE_TRUNC('month', CURRENT_DATE) AND as_of_date <= CURRENT_DATE)
         OR (as_of_date >= DATE_TRUNC('month', DATEADD('month', -1, CURRENT_DATE))
             AND as_of_date <= DATEADD('month', -1, CURRENT_DATE))
      GROUP BY 1, 2
      HAVING SUM(CASE WHEN as_of_date >= DATE_TRUNC('month', CURRENT_DATE)
                           AND as_of_date <= CURRENT_DATE
                      THEN snapshot_date_customer_revenue_final ELSE 0 END) > 0
      ORDER BY ABS(revenue_change) DESC
      LIMIT 20

  # ── REVENUE TRENDS / TIME SERIES ───────────────────────────────────────────

  - name: monthly_revenue_trend
    question: "Show me monthly consumption revenue over time."
    aliases:
      - monthly revenue trend
      - revenue by month
      - monthly consumption revenue
      - revenue over time by month
      - show monthly revenue
      - total revenue per month
      - revenue trend over time
    sql: |
      WITH monthly AS (
          SELECT
               DATE_TRUNC('month', as_of_date)                       AS month
              ,SUM(snapshot_date_customer_revenue_final)              AS monthly_revenue
              ,COUNT(DISTINCT metronome_customer_name)                AS unique_customers
              ,COUNT(*)                                               AS daily_records
          FROM analytics.prod_internal_bi.finance_consumption_revenue_explorer
          WHERE as_of_date <= CURRENT_DATE
          GROUP BY 1
      )
      SELECT
           month
          ,monthly_revenue
          ,unique_customers
          ,daily_records
          ,LAG(monthly_revenue) OVER (ORDER BY month)                AS prior_month_revenue
          ,monthly_revenue - LAG(monthly_revenue) OVER (ORDER BY month) AS mom_change
      FROM monthly
      ORDER BY month ASC

