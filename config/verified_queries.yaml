  # ── QUARTER-OVER-QUARTER ───────────────────────────────────────────────────

  - name: q3_q4_2025_revenue_comparison
    question: "How did revenue performance change from Q3 to Q4 2025?"
    aliases:
      - q3 vs q4 2025 revenue
      - q3 to q4 revenue change 2025
      - quarterly revenue comparison 2025
      - revenue q3 q4
    sql: |
      WITH quarterly AS (
          SELECT
               metronome_customer_name
              ,finance_segment
              ,SUM(CASE WHEN DATE_PART('quarter', as_of_date) = 3
                             AND DATE_PART('year', as_of_date) = 2025
                        THEN snapshot_date_customer_revenue_final ELSE 0 END) AS q3_revenue
              ,SUM(CASE WHEN DATE_PART('quarter', as_of_date) = 4
                             AND DATE_PART('year', as_of_date) = 2025
                        THEN snapshot_date_customer_revenue_final ELSE 0 END) AS q4_revenue
          FROM analytics.prod_internal_bi.finance_consumption_revenue_explorer
          WHERE DATE_PART('year', as_of_date) = 2025
            AND DATE_PART('quarter', as_of_date) IN (3, 4)
          GROUP BY 1, 2
      ),
      segment_summary AS (
          SELECT
               finance_segment
              ,SUM(q3_revenue)                              AS q3_revenue
              ,SUM(q4_revenue)                              AS q4_revenue
              ,SUM(q4_revenue) - SUM(q3_revenue)            AS revenue_change
              ,ROUND((SUM(q4_revenue) - SUM(q3_revenue))
                     / NULLIF(SUM(q3_revenue), 0) * 100, 1) AS pct_change
          FROM quarterly
          WHERE q3_revenue > 0 OR q4_revenue > 0
          GROUP BY 1
      )
      SELECT * FROM segment_summary
      ORDER BY revenue_change DESC

  - name: q3_q4_2025_total_growth
    question: "What was the total revenue change and growth rate from Q3 to Q4 2025?"
    aliases:
      - total q3 to q4 growth 2025
      - overall revenue change q3 q4
    sql: |
      WITH customer_rev AS (
          SELECT
               SUM(CASE WHEN DATE_PART('quarter', as_of_date) = 3
                             AND DATE_PART('year', as_of_date) = 2025
                        THEN snapshot_date_customer_revenue_final ELSE 0 END) AS q3_revenue
              ,SUM(CASE WHEN DATE_PART('quarter', as_of_date) = 4
                             AND DATE_PART('year', as_of_date) = 2025
                        THEN snapshot_date_customer_revenue_final ELSE 0 END) AS q4_revenue
          FROM analytics.prod_internal_bi.finance_consumption_revenue_explorer
          WHERE DATE_PART('year', as_of_date) = 2025
            AND DATE_PART('quarter', as_of_date) IN (3, 4)
      )
      SELECT
           q3_revenue
          ,q4_revenue
          ,q4_revenue - q3_revenue                                AS revenue_change
          ,ROUND((q4_revenue - q3_revenue) / NULLIF(q3_revenue, 0) * 100, 1) AS pct_change
      FROM customer_rev

  # ── WAU / ENGAGEMENT HEALTH ─────────────────────────────────────────────────

  - name: customers_by_wau_health
    question: "Which customers are at risk based on revenue per WAU?"
    aliases:
      - revenue per wau
      - wau health
      - customers at risk by wau
      - churn risk by engagement
      - over priced relative to usage
      - revenue efficiency by customer
      - wau vs revenue
      - engagement vs revenue health
      - customers with high rev per wau
      - customers with low wau
    sql: |
      SELECT
           metronome_customer_name
          ,finance_segment
          ,snapshot_date_customer_revenue_final          AS current_daily_revenue
          ,trailing_completed_4wk_waus_average           AS trailing_4wk_waus
          ,revenue_per_wau
          ,revenue_per_wau_range_simple                  AS health_bucket
      FROM analytics.prod_internal_bi.finance_consumption_revenue_explorer
      WHERE as_of_date = most_recent_revenue_date
        AND snapshot_date_customer_revenue_final > 0
      ORDER BY
        CASE revenue_per_wau_range_simple
          WHEN 'c_churn_risk'        THEN 1
          WHEN 'b_contraction_risk'  THEN 2
          WHEN 'a_growth_potential'  THEN 3
          ELSE 4
        END,
        revenue_per_wau DESC NULLS LAST

