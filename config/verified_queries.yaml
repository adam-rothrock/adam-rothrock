  # ── ACTUAL vs FORECAST BREAKAGE ─────────────────────────────────────────────

  - name: actual_breakage_revenue_by_period
    question: "How much breakage revenue has actually been recognized?"
    aliases:
      - actual breakage revenue
      - realized breakage
      - breakage actuals
      - how much breakage have we recognized
      - forgiveness revenue actuals
      - historical breakage
      - breakage revenue by month
    sql: |
      SELECT
           DATE_TRUNC('month', as_of_date)                  AS month
          ,SUM(recognized_breakage_revenue_actuals)         AS actual_breakage_revenue
          ,COUNT(DISTINCT CASE WHEN recognized_breakage_revenue_actuals > 0
                               THEN metronome_customer_name END) AS customers_with_breakage
      FROM analytics.prod_internal_bi.finance_consumption_revenue_explorer
      WHERE recognized_breakage_revenue_actuals > 0
      GROUP BY 1
      ORDER BY 1 ASC

  - name: forecast_vs_actual_breakage
    question: "Compare forecasted breakage (estimate at expiry) vs actual recognized breakage."
    aliases:
      - forecast vs actual breakage
      - breakage forecast vs actuals
      - projected vs realized breakage
      - compare breakage estimate to actual
    sql: |
      SELECT
           metronome_customer_name
          ,finance_segment
          ,SUM(recognized_breakage_revenue_actuals)         AS actual_breakage_recognized
          ,MAX(dollar_expected_commit_remaining)            AS projected_unused_commit_at_expiry
          ,commit_expiry_date
      FROM analytics.prod_internal_bi.finance_consumption_revenue_explorer
      WHERE as_of_date = most_recent_revenue_date
        AND (recognized_breakage_revenue_actuals > 0 OR dollar_expected_commit_remaining > 0)
      GROUP BY 1, 2, 5
      ORDER BY projected_unused_commit_at_expiry DESC NULLS LAST

