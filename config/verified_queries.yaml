  - name: commit_customers_under_consuming_breakage
    question: "Which customers are under-consuming their commit and at risk of breakage?"
    aliases:
      - customers under consuming commit
      - breakage risk customers
      - customers at risk of breakage
      - under consuming breakage
      - customers not burning down fast enough
      - pacing below straightline
      - customers consuming below their commit
      - which customers are below commit
      - who is under consuming
      - under consuming customers list
      - list customers below their commit
      - give me customers under consuming
      - customers below commit
    sql: |
      WITH base AS (
        SELECT
             DATE_TRUNC('month', commit_expiry_date)  AS expiry_month
            ,metronome_customer_name
            ,finance_segment
            ,commit_expiry_date
            ,days_remaining_in_commit
            ,commit_amount_remaining                  AS current_commit_balance
            ,dollar_expected_commit_remaining         AS projected_unused_commit_at_expiry
            ,ROW_NUMBER() OVER (
                PARTITION BY DATE_TRUNC('month', commit_expiry_date)
                ORDER BY dollar_expected_commit_remaining DESC NULLS LAST
            ) AS month_rank
        FROM analytics.prod_internal_bi.finance_consumption_revenue_explorer
        WHERE as_of_date = most_recent_revenue_date
          AND consumption_type ILIKE '%commit%'
          AND commit_consumption_pacing_group ILIKE '%under%'
      ),
      monthly_totals AS (
        SELECT
             expiry_month
            ,'-- MONTH TOTAL --'               AS metronome_customer_name
            ,NULL                              AS finance_segment
            ,NULL                              AS commit_expiry_date
            ,NULL                              AS days_remaining_in_commit
            ,SUM(current_commit_balance)       AS current_commit_balance
            ,SUM(projected_unused_commit_at_expiry) AS projected_unused_commit_at_expiry
            ,0                                 AS month_rank
        FROM base
        GROUP BY 1
      ),
      combined AS (
        SELECT * FROM monthly_totals
        UNION ALL
        SELECT * FROM base
      )
      SELECT
           expiry_month
          ,metronome_customer_name
          ,finance_segment
          ,commit_expiry_date
          ,days_remaining_in_commit
          ,current_commit_balance
          ,projected_unused_commit_at_expiry
          ,month_rank
      FROM combined
      ORDER BY expiry_month ASC, month_rank ASC

  - name: under_consuming_breakage_summary
    question: "How many customers are under-consuming and how much commit revenue is forecasted to expire unused?"
    aliases:
      - breakage revenue forecast
      - total projected breakage
      - how much commit will expire unused
      - forecast breakage revenue
      - total under consuming breakage
      - commit revenue expiring unused
      - how much breakage revenue do we have
      - breakage summary
      - under consuming summary
      - customers below commit summary
    sql: |
      WITH under_consuming AS (
        SELECT
             metronome_customer_name
            ,finance_segment
            ,commit_expiry_date
            ,days_remaining_in_commit
            ,commit_amount_remaining
            ,dollar_expected_commit_remaining
            ,snapshot_date_customer_revenue_final     AS current_daily_revenue
        FROM analytics.prod_internal_bi.finance_consumption_revenue_explorer
        WHERE as_of_date = most_recent_revenue_date
          AND consumption_type ILIKE '%commit%'
          AND commit_consumption_pacing_group ILIKE '%under%'
      )
      SELECT
           COUNT(DISTINCT metronome_customer_name)        AS under_consuming_customer_count
          ,SUM(dollar_expected_commit_remaining)          AS total_projected_breakage_revenue
          ,SUM(commit_amount_remaining)                   AS total_commit_balance_at_risk
          ,AVG(days_remaining_in_commit)                  AS avg_days_remaining_in_commit
      FROM under_consuming

