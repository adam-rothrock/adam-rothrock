          ,finance_segment
          ,SUM(snapshot_date_customer_revenue_final) AS total_revenue
      FROM analytics.prod_internal_bi.finance_consumption_revenue_explorer
      WHERE as_of_date >= DATE_TRUNC('month', CURRENT_DATE)
        AND as_of_date <= CURRENT_DATE
      GROUP BY 1, 2
      ORDER BY total_revenue DESC
      LIMIT 20

  # ── NEW LOGO / GROWTH ATTRIBUTION ─────────────────────────────────────────

  - name: new_logo_vs_growth_revenue
    question: "What is the revenue split between new logos and net growth?"
    aliases:
      - new logo vs growth revenue
      - new customers vs expansion revenue
      - new logo revenue breakdown
      - growth vs new logo
      - net growth vs new logo
      - new and expanding customer revenue
    sql: |
      SELECT
           new_logo_or_growth
          ,finance_segment
          ,SUM(snapshot_date_customer_revenue_final) AS total_revenue
          ,COUNT(DISTINCT metronome_customer_name)   AS unique_customers
      FROM analytics.prod_internal_bi.finance_consumption_revenue_explorer
      WHERE as_of_date >= DATE_TRUNC('month', CURRENT_DATE)
        AND as_of_date <= CURRENT_DATE
      GROUP BY 1, 2
      ORDER BY total_revenue DESC
