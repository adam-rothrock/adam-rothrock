queries:

  # ── COMMIT / BURNDOWN RISK ──────────────────────────────────────────────────

  - name: commit_customers_90_day_burndown
    question: "Which commit customers will exhaust their credit balance in the next 90 days?"
    aliases:
      - customers likely to run out of their commit soon
      - customers running out of commit in 90 days
      - what customers are likely to run out of their commit
      - commit customers almost out of credits
      - which customers will run out of commit next 90 days
      - customers expiring commit 90 days
      - commit burn down risk
    sql: |
      SELECT
           metronome_customer_name
          ,expected_credit_total_consumed_date
          ,commit_amount_remaining
          ,pct_commit_amount_remaining
          ,finance_segment
          ,DATEDIFF('day', CURRENT_DATE, expected_credit_total_consumed_date) AS days_until_exhausted
      FROM analytics.prod_internal_bi.finance_consumption_revenue_explorer
      WHERE as_of_date = most_recent_revenue_date
        AND expected_credit_total_consumed_date IS NOT NULL
        AND expected_credit_total_consumed_date BETWEEN CURRENT_DATE AND DATEADD('day', 90, CURRENT_DATE)
      ORDER BY expected_credit_total_consumed_date ASC

  - name: commit_customers_low_balance
    question: "Which customers are almost out of their commit balance?"
    aliases:
      - customers almost out of commit
      - show me customers running low on commit
      - commit customers less than 20 percent remaining
      - customers with less than 20% commit remaining
      - almost out of commit
      - commit balance low
      - customers running out of credits
      - pct commit remaining less than 20
    sql: |
      SELECT
           metronome_customer_name
          ,pct_commit_amount_remaining
          ,commit_amount_remaining
          ,expected_credit_total_consumed_date
          ,finance_segment
          ,as_of_date
      FROM analytics.prod_internal_bi.finance_consumption_revenue_explorer
