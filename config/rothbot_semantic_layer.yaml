      )
      SELECT
           cre.metronome_customer_name
          ,cre.finance_segment
          ,cre.commit_consumption_pacing_group
          ,cre.snapshot_date_customer_revenue_final  AS current_daily_revenue
          ,cre.commit_amount_remaining               AS current_commit_balance
          ,cre.expected_credit_total_consumed_date
          ,DATEDIFF('day', CURRENT_DATE, cre.expected_credit_total_consumed_date) AS days_until_commit_exhausted
      FROM analytics.prod_internal_bi.finance_consumption_revenue_explorer cre
      CROSS JOIN fy
      WHERE cre.consumption_type ILIKE '%commit%'
        AND cre.expected_credit_total_consumed_date BETWEEN CURRENT_DATE AND fy.fy_end
        AND cre.as_of_date = cre.most_recent_revenue_date
      ORDER BY days_until_commit_exhausted ASC

