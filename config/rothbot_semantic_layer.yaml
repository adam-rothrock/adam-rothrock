  - name: commit_customers_out_this_fiscal_quarter
    question: Which commit customers will exhaust their balance this fiscal quarter?
    sql: |
      WITH fq AS (
        SELECT
          DATE_FROM_PARTS(
            IFF(MONTH(CURRENT_DATE) = 1, YEAR(CURRENT_DATE)-1, YEAR(CURRENT_DATE)),
            CASE
              WHEN MONTH(CURRENT_DATE) BETWEEN 2 AND 4  THEN 2
              WHEN MONTH(CURRENT_DATE) BETWEEN 5 AND 7  THEN 5
              WHEN MONTH(CURRENT_DATE) BETWEEN 8 AND 10 THEN 8
              ELSE 11
            END, 1
          ) AS q_start,
          DATE_FROM_PARTS(
            IFF(MONTH(CURRENT_DATE) IN (11, 12), YEAR(CURRENT_DATE)+1, YEAR(CURRENT_DATE)),
            CASE
              WHEN MONTH(CURRENT_DATE) BETWEEN 2 AND 4  THEN 4
              WHEN MONTH(CURRENT_DATE) BETWEEN 5 AND 7  THEN 7
              WHEN MONTH(CURRENT_DATE) BETWEEN 8 AND 10 THEN 10
              ELSE 1
            END,
            CASE WHEN MONTH(CURRENT_DATE) BETWEEN 2 AND 4 THEN 30 ELSE 31 END
          ) AS q_end
      )
      SELECT
           cre.metronome_customer_name
          ,cre.finance_segment
          ,cre.commit_consumption_pacing_group
          ,cre.snapshot_date_customer_revenue_final  AS current_daily_revenue
          ,cre.commit_amount_remaining               AS current_commit_balance
          ,cre.expected_credit_total_consumed_date
          ,DATEDIFF('day', CURRENT_DATE, cre.expected_credit_total_consumed_date) AS days_until_commit_exhausted
      FROM analytics.prod_internal_bi.finance_consumption_revenue_explorer cre
      CROSS JOIN fq
      WHERE cre.consumption_type ILIKE '%commit%'
        AND cre.expected_credit_total_consumed_date BETWEEN fq.q_start AND fq.q_end
        AND cre.as_of_date = cre.most_recent_revenue_date
      ORDER BY days_until_commit_exhausted ASC

  - name: commit_customers_out_next_fiscal_quarter
    question: Show commit customers running out of credits next fiscal quarter.
    sql: |
      WITH nfq AS (
        SELECT
          DATE_FROM_PARTS(
            IFF(MONTH(CURRENT_DATE) IN (11, 12), YEAR(CURRENT_DATE)+1, YEAR(CURRENT_DATE)),
            CASE
              WHEN MONTH(CURRENT_DATE) BETWEEN 2 AND 4  THEN 5
              WHEN MONTH(CURRENT_DATE) BETWEEN 5 AND 7  THEN 8
              WHEN MONTH(CURRENT_DATE) BETWEEN 8 AND 10 THEN 11
              ELSE 2
            END, 1
          ) AS q_start,
          DATE_FROM_PARTS(
            CASE
              WHEN MONTH(CURRENT_DATE) BETWEEN 8 AND 10 THEN YEAR(CURRENT_DATE)+1
              WHEN MONTH(CURRENT_DATE) IN (11, 12)       THEN YEAR(CURRENT_DATE)+1
              ELSE YEAR(CURRENT_DATE)
            END,
            CASE
              WHEN MONTH(CURRENT_DATE) BETWEEN 2 AND 4  THEN 7
              WHEN MONTH(CURRENT_DATE) BETWEEN 5 AND 7  THEN 10
              WHEN MONTH(CURRENT_DATE) BETWEEN 8 AND 10 THEN 1
              ELSE 4
            END,
            CASE
              WHEN MONTH(CURRENT_DATE) BETWEEN 2 AND 7  THEN 31
              WHEN MONTH(CURRENT_DATE) BETWEEN 8 AND 10 THEN 31
              ELSE 30
            END
          ) AS q_end
      )
      SELECT
           cre.metronome_customer_name
          ,cre.finance_segment
          ,cre.commit_consumption_pacing_group
          ,cre.snapshot_date_customer_revenue_final  AS current_daily_revenue
          ,cre.commit_amount_remaining               AS current_commit_balance
          ,cre.expected_credit_total_consumed_date
          ,DATEDIFF('day', CURRENT_DATE, cre.expected_credit_total_consumed_date) AS days_until_commit_exhausted
      FROM analytics.prod_internal_bi.finance_consumption_revenue_explorer cre
      CROSS JOIN nfq
      WHERE cre.consumption_type ILIKE '%commit%'
        AND cre.expected_credit_total_consumed_date BETWEEN nfq.q_start AND nfq.q_end
        AND cre.as_of_date = cre.most_recent_revenue_date
      ORDER BY days_until_commit_exhausted ASC

  - name: commit_customers_out_this_fiscal_year
